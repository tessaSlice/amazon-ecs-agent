# systemd-tmpfiles configuration for the ECS GPU metrics runtime directory.
#
# dcgm-init (the writer) and the ECS agent container (the reader) share
# /var/run/ecs/gpu-metrics.json. Because /var/run is tmpfs, its contents are not
# persisted in the AMI/root filesystem image and must be recreated on every
# boot. systemd-tmpfiles-setup.service applies these rules at boot (before the
# ecs and dcgm-init units start), guaranteeing the directory and files exist so
# the agent container can bind-mount /var/run/ecs without a start-time mkdir.
#
# Type  Path                             Mode UID  GID  Age Argument
d /var/run/ecs                     0755 root root -
f /var/run/ecs/gpu-metrics.json     0644 root root -
f /var/run/ecs/gpu-metrics.json.tmp 0644 root root -
